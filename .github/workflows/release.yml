name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        shell: pwsh
        run: |
          $env:HTTP_PROXY=""
          $env:HTTPS_PROXY=""
          $env:ALL_PROXY=""
          npm.cmd run dist

      - name: Prepare zip package
        shell: pwsh
        run: |
          $releaseRoot = "github-release"
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          $portableExe = Get-ChildItem "dist" -Filter "*.exe" -File |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $portableExe) {
            throw "Portable exe was not found in dist."
          }

          $releaseExe = Join-Path $releaseRoot "CyberCowSalaryCalculator.exe"
          Copy-Item $portableExe.FullName $releaseExe -Force

          $zipPath = Join-Path $releaseRoot "CyberCowSalaryCalculator.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -LiteralPath $releaseExe -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberCowSalaryCalculator
          path: github-release/CyberCowSalaryCalculator.zip

      - name: Upload GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: github-release/CyberCowSalaryCalculator.zip
